spring:
  application:
    name: AnyOrder

  main:
    banner-mode: console
    log-startup-info: false

  datasource:
    url: jdbc:mysql://localhost:3306/AnyOrder?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: 1
      connection-timeout: 3000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    open-in-view: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  jackson:
    serialization:
      fail-on-empty-beans: false
      write-dates-as-timestamps: false
      indent-output: true

  # Configuración para archivos multipart (imágenes)
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

